RF_Integral:
    # Inertia (ESA INTEGRAL satellite, box approximation)
    # Dimensions: 2.8 x 3.2 x 5.0 m, mass ~4000 kg
    inertia:
        inertia_type: box
        m: 4000.0
        l: 5.0
        w: 3.2
        h: 2.8
    # See image in PR
    # z -> y 
    # rotate by -90 around x
    model_rotation_euler:
        x: -90.0
        y: 0.0
        z: 0.0
RF_Hubble:
    #https://science.nasa.gov/mission/hubble/overview/hubble-by-the-numbers/
    inertia:
        inertia_type: cylinder
        m: 12200.0
        r: 4.2
        h: 13.0
    # No rotation needed x is long axis
    # See image in PR
    model_rotation_euler:
        x: 0.0
        y: 0.0
        z: 0.0
RF_Target:
    # Inertia (ESA Target satellite, box approximation)
    # Dimensions: 1.0 x 1.0 x 1.0 m, mass ~100 kg
    inertia:
        inertia_type: custom
        Jx: 1
        Jy: 1
        Jz: 1
    # No rotation needed, z is long axis
    # See image in PR
    model_rotation_euler:
        x: 0.0
        y: 0.0
        z: 0.0
RF_CubeSat12U:
    # Canonical 12U CubeSat (dense bus only): 0.30 x 0.20 x 0.20 m, m = 24 kg.
    # Long axis along Z (h=0.30) so X/Y are the high-inertia directions per
    # the "X = highest inertial axis" convention in InertiaConfig.
    # A square 0.20 x 0.20 cross-section makes Jx = Jy (axisymmetric) which is
    # a tumbling-observability degeneracy; we use `custom` with a small Jx
    # perturbation (+5%) to break the symmetry without changing the physical
    # geometry. Edit the Jx number if you want stricter axisymmetry.
    inertia:
        inertia_type: custom
        Jx: 0.273   # 1.05 * (1/12) * 24 * (0.20^2 + 0.30^2)
        Jy: 0.260   # (1/12) * 24 * (0.20^2 + 0.30^2)
        Jz: 0.160   # (1/12) * 24 * (0.20^2 + 0.20^2)
    # The .blend asset is currently a unit cube (RF_Target); the visible 1.0 x
    # 0.2 x 0.2 m envelope (deployed solar panels) is realised via SceneConfig
    # `model_scale_xyz`, not by editing the .blend.
    model_rotation_euler:
        x: 0.0
        y: 0.0
        z: 0.0